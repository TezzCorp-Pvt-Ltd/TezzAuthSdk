apply plugin: 'com.android.application'

android {
    namespace 'com.example.tezzauth'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tezzauth"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Reference local Android SDK project
    implementation project(':sdk')

    // For production remote artifact consumption from GitHub Packages Maven:
    // implementation 'com.tezz.auth.android:auth-sdk-android:1.1.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
