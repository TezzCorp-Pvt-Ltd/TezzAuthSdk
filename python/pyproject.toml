[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tezz-auth"
version = "1.0.0"
description = "Official Python SDK for Tezz Auth"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
authors = [
    { name = "TezzCorp Pvt. Ltd.", email = "dev@tezzcorp.com" }
]
keywords = ["tezz", "authentication", "identity", "rsa", "jwt"]
dependencies = [
    "requests>=2.28.0",
    "cryptography>=41.0.0"
]

[project.urls]
Homepage = "https://account.tezzcorp.com"
