buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.tezz.auth.android'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release')
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.tezz.auth.android'
                artifactId = 'auth-sdk-android'
                version = '1.0.0'
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/TezzCorp-Pvt-Ltd/TezzAuthSdk')
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: 'TezzCorp-Pvt-Ltd'
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
