name: Build and Release SDKs

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish packages to public registries (NPM, PyPI, NuGet)?'
        required: true
        type: boolean
        default: false
      create_github_release:
        description: 'Create a GitHub Release with all built artifacts?'
        required: true
        type: boolean
        default: true
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # ─── 1. JavaScript / TypeScript (NPM) ─────────────────────────────────────────
  build-npm:
    name: Build NPM Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify syntax and package integrity
        run: |
          node -c src/index.js
          node -c src/client.js
          node -c src/crypto.js
          node -c src/errors.js

      - name: Pack NPM tarball
        run: |
          npm pack
          mkdir -p dist
          mv *.tgz dist/

      - name: Upload NPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-sdk-tarball
          path: npm/dist/*.tgz
          retention-days: 7

      - name: Publish to NPM Registry
        if: ${{ github.event.inputs.publish == 'true' }}
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish dist/*.tgz --access public || echo "::warning::NPM publish failed or version already published."
          else
            echo "::warning::NPM_TOKEN secret not provided. Skipping public NPM publish."
          fi

      - name: Publish to GitHub Packages (NPM)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp package.json package.json.bak
          node -e '
            const pkg = require("./package.json");
            pkg.name = "@tezzcorp-pvt-ltd/tezz-auth-sdk";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            require("fs").writeFileSync("./package.json", JSON.stringify(pkg, null, 2));
          '
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > .npmrc
          npm publish || echo "::warning::GitHub Packages NPM publish failed or version already exists."
          mv package.json.bak package.json
          rm -f .npmrc

  # ─── 2. Python (PyPI) ─────────────────────────────────────────────────────────
  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python sdist and wheel
        run: |
          python -m build

      - name: Validate distribution files
        run: |
          twine check dist/*

      - name: Upload Python Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-package
          path: python/dist/*
          retention-days: 7

      - name: Publish to PyPI
        if: ${{ github.event.inputs.publish == 'true' }}
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN || secrets.TWINE_PASSWORD }}
        run: |
          if [ -n "$TWINE_PASSWORD" ]; then
            twine upload --verbose --skip-existing dist/* || echo "::warning::PyPI publish failed or version already published."
          else
            echo "::warning::PYPI_API_TOKEN secret not provided. Skipping PyPI publish."
          fi

  # ─── 3. .NET C# (NuGet) ───────────────────────────────────────────────────────
  build-dotnet:
    name: Build .NET NuGet Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore dotnet/Tezz.Auth/Tezz.Auth.csproj

      - name: Build in Release mode
        run: dotnet build dotnet/Tezz.Auth/Tezz.Auth.csproj -c Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack dotnet/Tezz.Auth/Tezz.Auth.csproj -c Release -o dotnet/dist --no-build

      - name: Upload .NET Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-nuget
          path: dotnet/dist/*
          retention-days: 7

      - name: Publish to NuGet.org
        if: ${{ github.event.inputs.publish == 'true' }}
        continue-on-error: true
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY || secrets.NUGET_KEY || secrets.NUGET_TOKEN }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            dotnet nuget push dotnet/dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate || echo "::warning::NuGet publish failed or version already published."
          else
            echo "::warning::NUGET_API_KEY secret not provided. Skipping NuGet.org publish."
          fi

      - name: Publish to GitHub Packages (NuGet)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push dotnet/dist/*.nupkg --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/TezzCorp-Pvt-Ltd/index.json --skip-duplicate || echo "::warning::GitHub Packages NuGet publish failed or already exists."

  # ─── 4. PHP Composer ──────────────────────────────────────────────────────────
  build-php:
    name: Validate PHP Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, curl, json

      - name: Validate composer.json
        run: composer validate --strict

      - name: Create archive for distribution
        run: |
          mkdir -p dist
          zip -r dist/tezz-auth-sdk-php.zip src/ composer.json README.md

      - name: Upload PHP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-sdk-package
          path: php/dist/*.zip
          retention-days: 7

  # ─── 5. Java Standard (Maven) ────────────────────────────────────────────────
  build-java:
    name: Build Java Standard Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/standard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build JAR package with Maven
        run: mvn -B clean package

      - name: Publish to GitHub Packages (Maven)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B deploy -DskipTests -s ${{ github.workspace }}/settings.xml || echo "::warning::GitHub Packages Maven deploy failed or already exists."

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-sdk-jar
          path: java/standard/target/*.jar
          retention-days: 7

  # ─── 6. Android (AAR Library) ────────────────────────────────────────────────
  build-android:
    name: Build Android AAR Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Android AAR Library
        run: gradle assembleRelease --stacktrace

      - name: Publish Android AAR to GitHub Packages (Maven)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: gradle publishReleasePublicationToGitHubPackagesRepository || echo "::warning::Android AAR GitHub Packages publish failed."

      - name: Upload Android AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-aar
          path: java/android/build/outputs/aar/*.aar
          retention-days: 7

  # ─── 7. GitHub Release with Consolidated Artifacts ───────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-npm, build-python, build-dotnet, build-php, build-java, build-android]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && github.event.inputs.create_github_release == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-artifacts

      - name: Consolidate and label distribution assets
        run: |
          mkdir -p dist-all
          VERSION="${{ github.event.inputs.version }}"
          VERSION_CLEAN="${VERSION#v}"

          # 1. JavaScript / TypeScript (NPM)
          find release-artifacts/ -name "*.tgz" -exec cp {} "dist-all/tezz-auth-javascript-sdk-${VERSION_CLEAN}.tgz" \; 2>/dev/null || true

          # 2. Python (PyPI)
          find release-artifacts/ -name "*.whl" -exec cp {} "dist-all/tezz-auth-python-sdk-${VERSION_CLEAN}.whl" \; 2>/dev/null || true
          find release-artifacts/ -name "*.tar.gz" -exec cp {} "dist-all/tezz-auth-python-sdk-${VERSION_CLEAN}.tar.gz" \; 2>/dev/null || true
          find release-artifacts/ -name "*.whl" -exec cp {} dist-all/ \; 2>/dev/null || true

          # 3. .NET C# (NuGet)
          find release-artifacts/ -name "*.nupkg" -exec cp {} "dist-all/tezz-auth-dotnet-sdk-${VERSION_CLEAN}.nupkg" \; 2>/dev/null || true
          find release-artifacts/ -name "*.nupkg" -exec cp {} dist-all/ \; 2>/dev/null || true

          # 4. PHP Composer
          find release-artifacts/ -name "*.zip" -exec cp {} "dist-all/tezz-auth-php-sdk-${VERSION_CLEAN}.zip" \; 2>/dev/null || true

          # 5. Java Standard (Maven)
          find release-artifacts/java-sdk-jar -name "*.jar" -exec cp {} "dist-all/tezz-auth-java-standard-sdk-${VERSION_CLEAN}.jar" \; 2>/dev/null || true

          # 6. Android Library (AAR)
          find release-artifacts/android-sdk-aar -name "*.aar" -exec cp {} "dist-all/tezz-auth-android-sdk-${VERSION_CLEAN}.aar" \; 2>/dev/null || true

          echo "Consolidated cleanly named assets for release:"
          ls -lah dist-all/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: dist-all/*
          fail_on_unmatched_files: false
          body: |
            ## Tezz Auth Multi-Platform SDK Suite (${{ github.event.inputs.version }})

            Official client libraries for Tezz Auth (`account.tezzcorp.com`).

            ### Attached Downloadable Packages
            - **JavaScript / Node.js**: `tezz-auth-javascript-sdk-${{ github.event.inputs.version }}.tgz`
            - **Python**: `tezz-auth-python-sdk-${{ github.event.inputs.version }}.whl` & `.tar.gz`
            - **.NET (C#)**: `tezz-auth-dotnet-sdk-${{ github.event.inputs.version }}.nupkg`
            - **PHP**: `tezz-auth-php-sdk-${{ github.event.inputs.version }}.zip`
            - **Java Standard**: `tezz-auth-java-standard-sdk-${{ github.event.inputs.version }}.jar`
            - **Android (Java/Kotlin)**: `tezz-auth-android-sdk-${{ github.event.inputs.version }}.aar`

            ### License
            MIT License - Copyright (c) 2026 TezzCorp Pvt. Ltd.
